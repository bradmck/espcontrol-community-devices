name: Community Ref Bump

on:
  schedule:
    - cron: "0 4 * * 1"  # Weekly Monday 4am UTC
  workflow_dispatch:

# Read-only by default; each job below widens this for itself, and only for
# as long as it actually needs write access. Without an explicit grant the
# run inherits the repository default, which is read-only here.
permissions:
  contents: read

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    outputs:
      new_ref: ${{ steps.check.outputs.new_ref }}
      current_ref: ${{ steps.check.outputs.current_ref }}
      needs_bump: ${{ steps.check.outputs.needs_bump }}
    steps:
      - uses: actions/checkout@v7
      - name: Check for newer upstream release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source .github/scripts/retry.sh
          CURRENT=$(cat community/upstream-ref.txt)
          echo "current_ref=$CURRENT" >> $GITHUB_OUTPUT

          LATEST=$(retry gh api repos/jtenniswood/espcontrol/releases/latest --jq .tag_name)
          echo "Latest upstream: $LATEST, current pin: $CURRENT"

          if [ "$LATEST" != "$CURRENT" ]; then
            echo "new_ref=$LATEST" >> $GITHUB_OUTPUT
            echo "needs_bump=true" >> $GITHUB_OUTPUT
          else
            echo "needs_bump=false" >> $GITHUB_OUTPUT
          fi

  # Only step that needs write access to create the branch. Runs before any
  # third-party code (upstream generators, esphome) executes, so a
  # compromised dependency later in the pipeline never runs alongside this
  # token.
  push:
    runs-on: ubuntu-latest
    needs: check-upstream
    if: needs.check-upstream.outputs.needs_bump == 'true'
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Bump refs
        run: |
          python3 community/scripts/bump_refs.py ${{ needs.check-upstream.outputs.new_ref }}
      - name: Refresh UI cache stamp
        run: |
          # bump_refs.py just changed community/upstream-ref.txt, a
          # ui_stamp input; without this, the policy check's ui_stamp
          # --check fails for every device on the resulting PR.
          python3 community/scripts/ui_stamp.py --write
      - name: Create branch
        run: |
          source .github/scripts/retry.sh
          BRANCH="ref-bump/${{ needs.check-upstream.outputs.new_ref }}"
          git checkout -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: bump upstream ref to ${{ needs.check-upstream.outputs.new_ref }}"
          retry git push -u origin "$BRANCH"

  # Clones upstream and runs its generator scripts — third-party code. Keeps
  # write access (needed only to push the vendored-common refresh) but
  # nothing beyond assemble/vendor runs here, so this token is never live
  # alongside the esphome compiler.
  assemble:
    runs-on: ubuntu-latest
    needs: [check-upstream, push]
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ref-bump/${{ needs.check-upstream.outputs.new_ref }}
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
      - name: Assemble
        run: |
          source .github/scripts/retry.sh
          retry python3 community/scripts/assemble.py --skip-web
      - name: Refresh vendored common
        run: |
          source .github/scripts/retry.sh
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 community/scripts/vendor_common.py --source .assembly
          if ! git diff --quiet -- common/; then
            git add common/
            git commit -m "chore: refresh vendored common/ for ${{ needs.check-upstream.outputs.new_ref }}"
            retry git push
          fi

  # Runs the esphome compiler — the highest-risk third-party code execution
  # in this pipeline (it fetches and runs platformio toolchains). No
  # contents:write here: this job cannot push anywhere in the repo even if
  # compromised. It re-runs assemble to reproduce .assembly locally, since
  # each job starts on a fresh runner.
  compile:
    runs-on: ubuntu-latest
    needs: [check-upstream, push, assemble]
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ref-bump/${{ needs.check-upstream.outputs.new_ref }}
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
      - name: Assemble
        run: |
          source .github/scripts/retry.sh
          retry python3 community/scripts/assemble.py --skip-web
      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Install ESPHome
        run: |
          source .github/scripts/retry.sh
          retry pip install esphome==$(grep ESPHOME_VERSION .assembly/.github/esphome.env | cut -d= -f2)
      - name: Include parity report
        id: parity
        continue-on-error: true
        env:
          UPSTREAM_CLONE: .assembly
        run: |
          python3 community/scripts/check_include_parity.py 2>&1 | tee /tmp/parity-report.txt
      - name: Compile all devices
        id: compile
        continue-on-error: true
        run: |
          source .github/scripts/retry.sh
          # Without pipefail, `if esphome compile ... | tail -5` tests tail's
          # exit status, which is always 0 — every device was reported ✅ in
          # the PR body no matter how the compile went.
          set -o pipefail
          DEVICES=$(python3 -c "import json; print('\n'.join(json.load(open('community/devices.json'))['devices']))")
          RESULTS=""
          OVERALL="success"
          while IFS= read -r slug; do
            [ -z "$slug" ] && continue
            echo "=== Compiling $slug ==="
            cd .assembly
            # Fix external_components path for non-Docker CI (no /config mount)
            ASSEMBLY_ABS="$(pwd)"
            sed -i "s|file:///config|file://${ASSEMBLY_ABS}|g" "builds/$slug.yaml"
            if RETRY_ATTEMPTS=3 retry esphome compile "builds/$slug.yaml" 2>&1 | tail -5; then
              RESULTS="$RESULTS\n- ✅ $slug"
            else
              RESULTS="$RESULTS\n- ❌ $slug"
              OVERALL="failure"
            fi
            cd ..
          done <<< "$DEVICES"
          echo "COMPILE_RESULTS<<EOF" >> $GITHUB_ENV
          echo -e "$RESULTS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          echo "overall=$OVERALL" >> $GITHUB_OUTPUT
      - name: Open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source .github/scripts/retry.sh
          PARITY=$(cat /tmp/parity-report.txt 2>/dev/null || echo "N/A")
          BRANCH="ref-bump/${{ needs.check-upstream.outputs.new_ref }}"

          retry gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: bump upstream ref to ${{ needs.check-upstream.outputs.new_ref }}" \
            --label "ref-bump" \
            --body "## Upstream Ref Bump

          Bumps from \`${{ needs.check-upstream.outputs.current_ref }}\` to \`${{ needs.check-upstream.outputs.new_ref }}\`.

          ### Compile Results
          ${{ env.COMPILE_RESULTS }}

          ### Include Parity Report
          \`\`\`
          $PARITY
          \`\`\`

          ---
          **Do not auto-merge.** Review compile results and parity changes before merging."
